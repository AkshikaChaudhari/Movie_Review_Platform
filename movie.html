<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Movie Details - MovieReview</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">
            🎬 MovieReview
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="movies.html">
                        Movies
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="watchList.html">
                        Watchlist
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                    href="profile.html">
                        Profile
                    </a>
                </li>

                <li class="nav-item">
                    <a id="authLink"
                    class="nav-link"
                    href="login.html">
                        Login
                    </a>
                </li>
            </ul>

        </div>

    </div>

</nav>


<!-- MOVIE DETAILS -->

<main class="container py-5">

    <div id="movieDetails">

    </div>


    <!-- REVIEWS -->

    <section class="mt-5">

        <h2 class="mb-4">
            Reviews
        </h2>


        <div id="reviews">

            <div class="card mb-3">

                <div class="card-body">

                    <h6>
                        ⭐⭐⭐⭐⭐
                    </h6>

                    <p class="mb-0">
                        "One of the most amazing movies I have watched."
                    </p>

                </div>

            </div>


            <div class="card mb-3">

                <div class="card-body">

                    <h6>
                        ⭐⭐⭐⭐
                    </h6>

                    <p class="mb-0">
                        "Great story and excellent visuals."
                    </p>

                </div>

            </div>

        </div>

    </section>


    <!-- WRITE REVIEW -->

    <section class="mt-5">

        <h2>
            Write a Review
        </h2>

        <form id="reviewForm"
              class="mt-3">

            <div class="mb-3">

                <label class="form-label">
                    Rating
                </label>

                <select id="rating"
                        class="form-select">

                    <option value="5">
                        ⭐⭐⭐⭐⭐
                    </option>

                    <option value="4">
                        ⭐⭐⭐⭐
                    </option>

                    <option value="3">
                        ⭐⭐⭐
                    </option>

                    <option value="2">
                        ⭐⭐
                    </option>

                    <option value="1">
                        ⭐
                    </option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Your Review
                </label>

                <textarea
                    id="reviewText"
                    class="form-control"
                    rows="4"
                    placeholder="Share your thoughts about this movie...">
                </textarea>

            </div>


            <button type="submit"
                    class="btn btn-dark">

                Submit Review

            </button>

        </form>

    </section>

</main>

    <script src="movie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script>
        const currentUser =
            JSON.parse(localStorage.getItem("currentUser"));

        const authLink =
            document.getElementById("authLink");

        if (currentUser) {

            authLink.innerText = "Logout";
            authLink.href = "login.html";

            authLink.onclick = function() {
                localStorage.removeItem("currentUser");
            };

        }
    </script>

</body>

</html>
