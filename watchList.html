<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieReview - Watchlist</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar navbar-expand-lg navbar-dark movie-navbar">

        <div class="container">

            <a
                class="navbar-brand d-flex align-items-center gap-2"
                href="index.html"
            >
                🎬 MovieReview
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#movieNavbar"
                aria-controls="movieNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="movieNavbar"
            >

                <div class="navbar-nav ms-auto">

                    <a
                        class="nav-link"
                        href="index.html"
                    >
                        Home
                    </a>

                    <a
                        class="nav-link"
                        href="movies.html"
                    >
                        Movies
                    </a>

                    <a
                        class="nav-link active"
                        href="watchList.html"
                    >
                        Watchlist
                    </a>

                    <a
                        class="nav-link"
                        href="profile.html"
                    >
                        Profile
                    </a>

                    <a
                        class="nav-link"
                        href="login.html"
                    >
                        Login
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- =========================
         WATCHLIST MAIN
    ========================== -->

    <main class="container watchlist-page">

        <div class="watchlist-heading">

            <h1>
                🎬 My Movie Watchlist
            </h1>

            <p>
                Movies you have saved to watch later.
            </p>

        </div>


        <!-- Movies will be inserted here by JavaScript -->

        <div
            id="watchlistContainer"
            class="watchlist-container"
        >

            <!-- Empty watchlist message -->

            <div
                id="emptyAlert"
                class="watchlist-empty"
            >

                <div class="empty-icon">
                    🍿
                </div>

                <h3>
                    Your watchlist is empty
                </h3>

                <p>
                    You haven't added any movies yet.
                </p>

                <a
                    href="movies.html"
                    class="discover-btn"
                >
                    Explore Movies
                </a>

            </div>

        </div>

    </main>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Watchlist JavaScript -->

    <script src="watchList.js"></script>

</body>

</html>
