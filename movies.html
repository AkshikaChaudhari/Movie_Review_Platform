<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MovieReview - Movies</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">
            🎬 MovieReview
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       href="movies.html">
                        Movies
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="watchList.html">
                        Watchlist
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="profile.html">
                        Profile
                    </a>
                </li>

                    <li class="nav-item">
                        <a id="authLink" class="nav-link" href="login.html">
                            Login
                        </a>
                    </li>
                </ul>

        </div>

    </div>

</nav>


<!-- MAIN CONTENT -->

<main class="container py-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            Explore Movies
        </h1>

        <p class="text-muted">
            Discover movies and share your reviews.
        </p>

    </div>


    <!-- SEARCH + FILTER -->

    <div class="row g-3 mb-5">

        <div class="col-md-8">

            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="🔍 Search movies..."
            >

        </div>


        <div class="col-md-4">

            <select id="genreFilter"
                    class="form-select">

                <option value="all">
                    All Genres
                </option>

                <option value="Sci-Fi">
                    Sci-Fi
                </option>

                <option value="Comedy">
                    Comedy
                </option>

                <option value="Romance">
                    Romance
                </option>

                <option value="Action">
                    Action
                </option>

            </select>

        </div>

    </div>


    <!-- MOVIES -->

    <div id="movieContainer"
         class="row g-4">

    </div>

</main>


<script src="movies.js"></script>


<script>
    const currentUser =
        JSON.parse(localStorage.getItem("currentUser"));

    const authLink =
        document.getElementById("authLink");

    if (currentUser) {

        authLink.innerText = "Logout";

        authLink.href = "login.html";

        authLink.onclick = function() {
            localStorage.removeItem("currentUser");
        };

    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
